version: 2

updates:
  # ── Node, whole pnpm workspace ────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Manila"
    open-pull-requests-limit: 5
    versioning-strategy: "increase"
    labels: ["dependencies", "node"]
    groups:
      # One PR for the routine noise, so the review budget goes to the
      # updates that actually matter.
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      production-patches:
        dependency-type: "production"
        update-types: ["patch"]
    ignore:
      # Next, React, and Rapier majors need a deliberate migration, not an
      # automated PR two days before a submission deadline.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@dimforge/rapier3d-compat"
        update-types: ["version-update:semver-major"]

  # ── Python services ───────────────────────────────────────────────
  - package-ecosystem: "pip"
    directories:
      - "/services/agent"
      - "/services/reconstruction"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Manila"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # mypy 2.x is a deliberate migration against `strict = true`, not an
      # automated PR a week before a submission deadline. `pip-audit --strict`
      # still blocks CI on any actual advisory, so this trades away no security.
      - dependency-name: "mypy"
        update-types: ["version-update:semver-major"]
      # Same argument as @dimforge/rapier3d-compat above: a torch major changes
      # numerical results, and the +cu124 local version is pinned to a specific
      # PyTorch index. Both have to move together, by hand.
      - dependency-name: "torch"
        update-types: ["version-update:semver-major"]
      - dependency-name: "torchvision"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions ────────────────────────────────────────────────

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Manila"
    labels: ["dependencies", "ci"]

  # ── Base images ───────────────────────────────────────────────────
  - package-ecosystem: "docker"
    # A glob, not an enumerated list. An explicit list means every new service
    # is silently unmonitored until someone remembers to add it here, and the
    # one place that failure shows up is a CVE nobody was told about.
    directories:
      - "/services/*"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Manila"
    labels: ["dependencies", "docker"]
    ignore:
      # Node 22.23.2 is pinned in four places (.nvmrc, the root `engines`
      # field, CI's NODE_VERSION, and the web + physics Dockerfiles); Python
      # 3.12.14 in two (each service's requires-python, and its Dockerfile).
      # A major bump here updates the Dockerfile and nothing else, so it lands
      # as a red PR every Monday and is closed every Monday. Patch and minor
      # bumps still come through, and that is where base image CVE fixes live.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
