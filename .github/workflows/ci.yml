name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# THIRD-PARTY ACTIONS ARE PINNED TO COMMIT SHAs, NOT TAGS.
# A tag is a mutable pointer: whoever controls an action repository can re-point
# v4 at new code, and every job below runs with a GITHUB_TOKEN. A SHA cannot be
# moved. The trailing "# vN" comment is what Dependabot's github-actions
# ecosystem reads to offer a readable upgrade PR when a new version ships, so
# pinning here costs nothing in maintenance.

# GITHUB_TOKEN is read-only for every job unless a job widens it. The default
# is write, and a write token in a job that runs third-party code is how a
# malicious dependency pushes a commit.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.23.2"
  PNPM_VERSION: "10.11.0"
  PYTHON_VERSION: "3.12"

jobs:
  # ────────────────────────────────────────────────────────────────
  node:
    name: Node — lint, typecheck, test, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Contracts first: every other package imports @rinne/contracts through dist/.
      - name: Build contracts
        run: pnpm contracts:build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Test
        run: pnpm -r run test

      - name: Format check
        run: pnpm format:check

      # Blocking on purpose. A high-severity advisory in a dependency is not a warning.
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  # ────────────────────────────────────────────────────────────────
  python:
    name: Python — lint, typecheck, test, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # uv 0.10.10, matching services/agent/Dockerfile and the local toolchain.
      # NOT 0.5.14. services/agent/uv.lock is written at `revision = 3`, a
      # lockfile revision no uv older than 0.8 can be trusted to read. The
      # Dockerfile was already moved to 0.10.10 for exactly this reason; CI was
      # left behind, so the build and the test job were reading one lockfile
      # through two different uv releases.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10
        with:
          version: "0.10.10"
          enable-cache: true
          cache-dependency-glob: "services/agent/uv.lock"

      - name: Install
        run: uv sync --locked --all-groups

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest

      - name: Audit dependencies
        # Audit the EXPORTED LOCKFILE, not the installed environment.
        # `pip-audit --strict` treats any package it cannot resolve as a
        # failure, and rinne-agent is a local project that will never exist on
        # PyPI - so auditing the environment always fails. Exporting with
        # --no-emit-project gives exactly the third-party dependency set, and
        # --strict then means what it should: an unauditable THIRD-PARTY
        # package fails the build.
        run: |
          uv export --no-emit-project --format requirements-txt --quiet > /tmp/requirements.txt
          uv run pip-audit --strict --progress-spinner=off --requirement /tmp/requirements.txt

  # ────────────────────────────────────────────────────────────────
  contracts-drift:
    name: Contracts — generated output matches the schemas
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Same pin as the python job. This one runs datamodel-codegen through
      # `uv tool run`, so a uv that cannot read the lockfile fails the drift
      # check for a reason that has nothing to do with the schemas.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10
        with:
          version: "0.10.10"
          enable-cache: true

      - run: pnpm install --frozen-lockfile

      - name: Regenerate TypeScript from the schemas
        run: pnpm contracts:generate

      - name: Regenerate Pydantic from the schemas
        shell: pwsh
        run: ./packages/contracts/scripts/generate-python.ps1

      # THIS IS THE GATE. §8 promises that drift between the schema and the
      # generated code becomes a build failure instead of a wrong answer on
      # camera. This is that promise, executable.
      - name: Fail if the committed output is stale
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::Generated contracts are out of date."
            echo "A schema changed without regenerating. Run:"
            echo "  pnpm contracts:generate"
            echo "  pwsh ./packages/contracts/scripts/generate-python.ps1"
            git diff
            exit 1
          fi

  # ────────────────────────────────────────────────────────────────
  secrets:
    name: Secret scanning — full history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Assert the private blueprint is absent from history
        run: |
          if git log --all --name-only --pretty=format: \
             | sort -u | grep -Ei '[^/]*blueprint[^/]*\.md$'; then
            echo "::error::A Blueprint document is present in git history."
            exit 1
          fi
          echo "No blueprint document in history."

  # ────────────────────────────────────────────────────────────────
  containers:
    name: Container images build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [web, physics, agent]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
