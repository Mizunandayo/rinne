name: Deploy

# MANUAL DISPATCH ONLY. Not on push, not on merge, not on tag.
#
# Deploy is the highest-privilege thing this repository can do. Wiring it to a
# push event means any path that produces a commit on main — a compromised
# dependency in a workflow, a mis-merged PR — reaches production automatically.
# One human click costs ten seconds and removes that entire class of risk.
on:
  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated: physics,agent,web"
        required: true
        default: "physics,agent,web"
        type: string

# Third-party actions are pinned to commit SHAs, not tags - see ci.yml for why.
# This workflow matters more than most: it holds id-token: write and can
# impersonate the deployer service account.
permissions:
  contents: read
  id-token: write # required to mint the OIDC token for WIF. Nothing else.

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloud Run
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production # add a required reviewer here in repo settings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Deploy
        shell: pwsh
        run: |
          ./infra/scripts/deploy-all.ps1 `
            -Services ("${{ inputs.services }}".Split(',')) `
            -Tag "${{ github.sha }}".Substring(0,7) `
            -UseCloudBuild

      - name: Smoke test
        shell: pwsh
        run: ./infra/scripts/smoke-test.ps1
